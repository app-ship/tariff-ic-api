options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # Step 1: Ensure Artifact Registry repository exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories create infis-repo \
          --repository-format=docker \
          --location=us-central1 \
          --description="Docker repository for Infis services" \
          || true

  # Step 2: Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'
      - '.'

  # Step 3: Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'

  # Step 4: Deploy
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tariff-ic-api-staging'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8080'
      - '--timeout=600'
      - '--concurrency=80'
      - '--vpc-connector=projects/infis-ai/locations/us-central1/connectors/run-staging-connector'
      - '--vpc-egress=all-traffic'
      - '--env-vars-file=env.staging'
      - '--set-secrets=MONGODB_URI=TARIFF_IC_MONGODB_URI:latest,CRON_SECRET=TARIFF_IC_CRON_SECRET:latest'

  # Best-effort cleanup: keep last 5 revisions, never touch the revision currently
  # serving traffic. Never fails the build (always exits 0).
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        svc=tariff-ic-api-staging
        serving=$$(gcloud run services describe "$$svc" --region=us-central1 --format='value(status.traffic[].revisionName)' 2>/dev/null)
        gcloud run revisions list --service="$$svc" --region=us-central1 \
          --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)' 2>/dev/null \
          | tail -n +6 \
          | while read -r rev; do
              echo "$$serving" | grep -qFx "$$rev" && continue
              gcloud run revisions delete "$$rev" --region=us-central1 --async --quiet || true
            done
        exit 0

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'

timeout: '1200s'
