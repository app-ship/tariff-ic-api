options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # Step 1: Ensure Artifact Registry repository exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories create infis-repo \
          --repository-format=docker \
          --location=us-central1 \
          --description="Docker repository for Infis services" \
          || true

  # Step 2: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'
      - '.'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'

  # Step 4: Deploy to Cloud Run (staging)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tariff-ic-api-staging'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8080'
      - '--timeout=120'
      - '--concurrency=80'
      - '--env-vars-file=env.staging'
      - '--set-secrets=API_KEY=TARIFF_IC_API_KEY_STAGING:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api-staging:$BUILD_ID'

timeout: '1200s'
