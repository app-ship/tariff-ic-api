options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # Step 1: Ensure Artifact Registry repository exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories create infis-repo \
          --repository-format=docker \
          --location=us-central1 \
          --description="Docker repository for Infis services" \
          || true

  # Step 2: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api:$BUILD_ID'
      - '.'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api:$BUILD_ID'

  # Step 4: Deploy to Cloud Run (production)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tariff-ic-api'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api:$BUILD_ID'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=8080'
      - '--timeout=600'
      - '--concurrency=80'
      - '--env-vars-file=env.production'
      - '--set-secrets=MONGODB_URI=tariffic-mongodb-prod:latest,AUTH0_CLIENT_SECRET=TARIFF_IC_AUTH0_CLIENT_SECRET:latest,CRON_SECRET=TARIFF_IC_CRON_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PRICE_ID=STRIPE_PRICE_ID:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,ADMIN_SECRET=ADMIN_SECRET:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/infis-repo/tariff-ic-api:$BUILD_ID'

timeout: '1200s'
